[package]
name = "azd-gui"
version = "0.1.2"
description = "A guided desktop experience for Azure Developer CLI deployments"
authors = ["azd-gui contributors"]
edition = "2021"
rust-version = "1.90"
license = "Unlicense"
repository = "https://github.com/nathanmcnulty/azd-gui"

[lib]
name = "azd_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["large-dates", "parsing"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
tauri-utils = { path = "../tauri-utils-2.10.4" }

name: Signed Windows release
run-name: Signed Windows release for ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: I intend to consume a Windows runner and Azure signing operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ARTIFACT_SIGNING_ENDPOINT: https://wus2.codesigning.azure.net/
  ARTIFACT_SIGNING_ACCOUNT: asa-nathanmcnulty
  ARTIFACT_SIGNING_PROFILE: kvpp-public-trust

concurrency:
  group: signed-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and sign Windows artifacts
    if: startsWith(github.ref, 'refs/tags/v') || inputs.confirm_release == true
    runs-on: windows-latest
    timeout-minutes: 45
    environment: artifact-signing
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Verify application and tag versions agree
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String `
            -Path src-tauri/Cargo.toml `
            -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value

          $versionCount = @($packageVersion, $tauriVersion, $cargoVersion) |
            Select-Object -Unique |
            Measure-Object |
            Select-Object -ExpandProperty Count
          if ($versionCount -ne 1) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag '$env:GITHUB_REF_NAME' must equal 'v$packageVersion'."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: npm run audit:dependencies

      - name: Check frontend and run tests
        run: npm run check && npm test

      - name: Check Rust formatting
        run: npm run format:native

      - name: Lint native code
        run: npm run lint:native

      - name: Test native code
        run: npm run test:native

      - name: Build application without bundling
        run: npm run tauri -- build --no-bundle --ci

      # Authenticate only after validation and compilation so the short-lived
      # OIDC assertion is fresh and failed builds never request signing access.
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\src-tauri\target\release\azd-gui.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create NSIS installer
        run: npm run tauri -- bundle --bundles nsis --ci

      - name: Sign NSIS installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\src-tauri\target\release\azd-gui.exe"
          )
          $files += Get-ChildItem `
            -Path "${{ github.workspace }}\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe |
            Select-Object -ExpandProperty FullName

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on '$file': $($signature.Status)"
            }
          }

      - name: Create release checksums
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\src-tauri\target\release\azd-gui.exe"
          )
          $files += Get-ChildItem `
            -Path "${{ github.workspace }}\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe |
            Select-Object -ExpandProperty FullName
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $checksums | Set-Content `
            -Path "${{ github.workspace }}\src-tauri\target\release\SHA256SUMS.txt" `
            -Encoding utf8

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-deployment-studio-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/azd-gui.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/SHA256SUMS.txt

      - name: Stage draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "${{ github.workspace }}\src-tauri\target\release\azd-gui.exe",
            "${{ github.workspace }}\src-tauri\target\release\SHA256SUMS.txt"
          )
          $files += Get-ChildItem `
            -Path "${{ github.workspace }}\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe |
            Select-Object -ExpandProperty FullName
          $existingDraft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft -ne "true") {
              throw "Release '$env:GITHUB_REF_NAME' is already public; refusing to replace its assets."
            }
            gh release upload $env:GITHUB_REF_NAME --clobber @files
          } else {
            gh release create $env:GITHUB_REF_NAME `
              --draft `
              --verify-tag `
              --generate-notes `
              --title "Azure Deployment Studio $env:GITHUB_REF_NAME" `
              @files
          }

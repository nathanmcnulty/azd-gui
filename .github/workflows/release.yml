name: Signed Windows release
run-name: Signed Windows release for ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: I intend to consume a Windows runner and Azure signing operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ARTIFACT_SIGNING_ENDPOINT: https://wus2.codesigning.azure.net/
  ARTIFACT_SIGNING_ACCOUNT: asa-nathanmcnulty
  ARTIFACT_SIGNING_PROFILE: kvpp-public-trust
  ARTIFACT_SIGNING_SUBJECT: CN=Nathan McNulty, O=Nathan McNulty, L=Soldotna, S=Alaska, C=US

concurrency:
  group: signed-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and sign Windows artifacts
    if: >-
      (github.repository == 'nathanmcnulty/azd-gui' && startsWith(github.ref, 'refs/tags/v') &&
       (github.event_name == 'push' || inputs.confirm_release == true)) ||
      (!startsWith(github.ref, 'refs/tags/v') && inputs.confirm_release == true)
    runs-on: windows-latest
    timeout-minutes: 45
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      tag-object: ${{ steps.tag.outputs.oid }}
      evidence-sha256: ${{ steps.source.outputs.evidence-sha256 }}
      source-sha256: ${{ steps.source.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
          persist-credentials: false

      - name: Verify signed release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $oid = ./scripts/confirm-release-tag.ps1 -ReleaseRef $env:GITHUB_REF -EventCommit $env:GITHUB_SHA
          "oid=$oid" >> $env:GITHUB_OUTPUT

      - name: Assert PowerShell 7.6 minimum
        shell: pwsh
        run: ./scripts/assert-powershell-version.ps1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.4xx'

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable

      - name: Verify application and tag versions agree
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String `
            -Path src-tauri/Cargo.toml `
            -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value

          $versionCount = @($packageVersion, $tauriVersion, $cargoVersion) |
            Select-Object -Unique |
            Measure-Object |
            Select-Object -ExpandProperty Count
          if ($versionCount -ne 1) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag '$env:GITHUB_REF_NAME' must equal 'v$packageVersion'."
          }

      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Test offline PowerShell signing and verification
        run: npm run test:powershell

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: npm run audit:dependencies

      - name: Check frontend and run tests
        run: npm run check && npm test

      - name: Check Rust formatting
        run: npm run format:native

      - name: Lint native code
        run: npm run lint:native

      - name: Test native code
        run: npm run test:native

      - name: Test owned Graph process adapter offline
        shell: pwsh
        run: ./tools/Test-GraphProcessAdapter.ps1 -BuildRoot (Join-Path $env:RUNNER_TEMP 'graph-offline-adapter')

      - name: Build application without bundling
        run: npm run tauri -- build --no-bundle --ci

      # Authenticate only after validation and compilation so the short-lived
      # OIDC assertion is fresh and failed builds never request signing access.
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned signing module
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery

      # Tauri changes the executable's bundle-type marker. Its signing hook runs
      # AFTER that change and also signs the uninstaller and final installer.
      - name: Bundle and sign NSIS payload and installer
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-signing.json'
          @{
            bundle = @{ windows = @{ signCommand = @{
              cmd = (Get-Command pwsh).Source
              args = @('-NoProfile', '-File', "$env:GITHUB_WORKSPACE/scripts/sign-windows-artifact.ps1", '-Path', '%1')
            } } }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $config
          $env:AZD_NSIS_PAYLOAD_RECEIPT = Join-Path $env:RUNNER_TEMP 'nsis-payload.sha256'
          if (Test-Path -LiteralPath $env:AZD_NSIS_PAYLOAD_RECEIPT) { throw 'NSIS payload receipt already exists.' }
          npm run tauri -- bundle --bundles nsis --ci --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS bundling failed.' }
          if (-not (Test-Path -LiteralPath $env:AZD_NSIS_PAYLOAD_RECEIPT)) { throw 'Missing signed NSIS payload receipt.' }

      # Bundling restores the original, unpatched executable for portable use.
      - name: Sign portable executable
        shell: pwsh
        run: ./scripts/sign-windows-artifact.ps1 -Path ./src-tauri/target/release/azd-gui.exe

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\src-tauri\target\release\azd-gui.exe"
          )
          $files += Get-ChildItem `
            -Path "${{ github.workspace }}\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe |
            Select-Object -ExpandProperty FullName

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on '$file': $($signature.Status)"
            }
          }

      - name: Create release checksums
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\src-tauri\target\release\azd-gui.exe"
          )
          $files += Get-ChildItem `
            -Path "${{ github.workspace }}\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe |
            Select-Object -ExpandProperty FullName
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $checksums | Set-Content `
            -Path "${{ github.workspace }}\src-tauri\target\release\SHA256SUMS.txt" `
            -Encoding utf8

      - name: Verify installed payload before upload
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'release-verification'
          $install = Join-Path $env:LOCALAPPDATA 'azd-gui-release-verification'
          if (Test-Path -LiteralPath $install) { throw 'Verification install directory already exists.' }
          New-Item -ItemType Directory -Path $release | Out-Null
          $installer = @(Get-ChildItem ./src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          Copy-Item ./src-tauri/target/release/azd-gui.exe, ./src-tauri/target/release/SHA256SUMS.txt -Destination $release
          Copy-Item -LiteralPath $installer[0].FullName -Destination $release
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/verify-release-artifacts.ps1 -ReleaseDirectory $release -ExpectedVersion $version -ExpectedSignerSubject $env:ARTIFACT_SIGNING_SUBJECT
          try {
            $process = Start-Process -FilePath (Join-Path $release $installer[0].Name) -ArgumentList @('/S', "/D=$install") -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)." }
            $payloadHash = (Get-Content (Join-Path $env:RUNNER_TEMP 'nsis-payload.sha256') -Raw).Trim()
            if ($payloadHash -notmatch '^[A-Fa-f0-9]{64}$' -or (Get-FileHash "$install/azd-gui.exe" -Algorithm SHA256).Hash -ne $payloadHash) {
              throw 'Installed executable does not match the signed NSIS payload.'
            }
            ./scripts/verify-release-artifacts.ps1 -ReleaseDirectory $release -ExpectedVersion $version -ExpectedSignerSubject $env:ARTIFACT_SIGNING_SUBJECT -InstalledExecutablePath "$install/azd-gui.exe" -EvidencePath ./src-tauri/target/release/installed-artifact-verification.json
          } finally {
            $uninstaller = Join-Path $install 'uninstall.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
              if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)." }
              for ($attempt = 0; $attempt -lt 20 -and (Test-Path "$install/azd-gui.exe"); $attempt++) { Start-Sleep -Seconds 1 }
              if (Test-Path "$install/azd-gui.exe") { throw 'Uninstall left the application executable behind.' }
            }
          }

      - name: Prepare exact source bundle for attestation
        id: source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release'
          $bundle = ./scripts/new-release-source-bundle.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Commit $env:GITHUB_SHA -OutputDirectory $release
          $evidence = Get-FileHash (Join-Path $release 'installed-artifact-verification.json') -Algorithm SHA256
          "path=$($bundle.Path)" >> $env:GITHUB_OUTPUT
          "sha256=$($bundle.Sha256)" >> $env:GITHUB_OUTPUT
          "evidence-sha256=$($evidence.Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload signed Windows artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-deployment-studio-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/azd-gui.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/SHA256SUMS.txt
            src-tauri/target/release/installed-artifact-verification.json
            ${{ steps.source.outputs.path }}

  attest:
    name: Attest verified release bytes
    needs: windows
    if: github.repository == 'nathanmcnulty/azd-gui' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck tag and release artifact identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT: ${{ needs.windows.outputs.tag-object }}
          ARTIFACT_ID: ${{ needs.windows.outputs.artifact-id }}
        run: |
          if ($env:ARTIFACT_ID -cnotmatch '\A[1-9][0-9]*\z') { throw 'Missing immutable release artifact ID.' }
          $null = ./scripts/confirm-release-tag.ps1 -ReleaseRef $env:GITHUB_REF -EventCommit $env:GITHUB_SHA -ExpectedTagObject $env:TAG_OBJECT

      - name: Download the exact verified artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-payload

      - name: Verify and select the three attestation subjects
        id: subjects
        shell: pwsh
        env:
          EVIDENCE_SHA256: ${{ needs.windows.outputs.evidence-sha256 }}
          SOURCE_SHA256: ${{ needs.windows.outputs.source-sha256 }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'release-payload'
          $files = ./scripts/get-release-attestation-files.ps1 -ReleaseDirectory $root -Commit $env:GITHUB_SHA -EvidenceSha256 $env:EVIDENCE_SHA256 -SourceSha256 $env:SOURCE_SHA256
          "source=$($files.Source)" >> $env:GITHUB_OUTPUT
          "portable=$($files.Portable)" >> $env:GITHUB_OUTPUT
          "installer=$($files.Installer)" >> $env:GITHUB_OUTPUT

      - name: Attest the source and final signed Windows files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.subjects.outputs.source }}
            ${{ steps.subjects.outputs.portable }}
            ${{ steps.subjects.outputs.installer }}

  stage_release:
    name: Stage the GitHub release draft
    needs: [windows, attest]
    if: github.repository == 'nathanmcnulty/azd-gui' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck tag and release artifact identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT: ${{ needs.windows.outputs.tag-object }}
          ARTIFACT_ID: ${{ needs.windows.outputs.artifact-id }}
        run: |
          if ($env:ARTIFACT_ID -cnotmatch '\A[1-9][0-9]*\z') { throw 'Missing immutable release artifact ID.' }
          $null = ./scripts/confirm-release-tag.ps1 -ReleaseRef $env:GITHUB_REF -EventCommit $env:GITHUB_SHA -ExpectedTagObject $env:TAG_OBJECT

      - name: Download the exact verified artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-payload

      - name: Stage draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SHA256: ${{ needs.windows.outputs.evidence-sha256 }}
          SOURCE_SHA256: ${{ needs.windows.outputs.source-sha256 }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'release-payload'
          $files = ./scripts/get-release-attestation-files.ps1 -ReleaseDirectory $root -Commit $env:GITHUB_SHA -EvidenceSha256 $env:EVIDENCE_SHA256 -SourceSha256 $env:SOURCE_SHA256
          $files = @($files.Portable, $files.Checksums, $files.Installer)
          $existingDraft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft -ne "true") {
              throw "Release '$env:GITHUB_REF_NAME' is already public; refusing to replace its assets."
            }
            gh release upload $env:GITHUB_REF_NAME --clobber @files
          } else {
            gh release create $env:GITHUB_REF_NAME `
              --draft `
              --verify-tag `
              --generate-notes `
              --title "Azure Deployment Studio $env:GITHUB_REF_NAME" `
              @files
          }

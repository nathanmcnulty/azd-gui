name: Unsigned Windows dependency smoke
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    if: >-
      github.repository == 'nathanmcnulty/azd-gui' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/gui-154-windows-smoke'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c8d7df8c7d7262bf5078a368704fc762f4bc4c1f
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.4xx'
      - name: Build and exercise the unsigned package
        shell: pwsh
        run: ./tools/Test-UnsignedWindowsSmoke.ps1 -Source ./source

name: Manual validation
run-name: Validate ${{ github.ref_name }} on ${{ inputs.runner }}

# Development validation is local by default. This workflow intentionally has
# no push or pull_request trigger so ordinary development consumes no hosted
# runner minutes. Select one platform only when remote validation is necessary.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Platform that genuinely needs hosted validation
        required: true
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - ubuntu-24.04
          - macos-latest

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run ci

      - name: Check Rust formatting
        run: npm run format:native

      - name: Lint native code
        run: npm run lint:native

      - name: Test native code
        run: npm run test:native
